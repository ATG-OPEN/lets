name: ci

on:
  push:
  pull_request:

# LETS runs on MCUs; the host build exists only to run the kernel's tests on a PC.
# One Linux run is enough for that (the macOS runners were mostly unavailable).
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the host demo
        run: make
      - name: host tests
        run: make test
